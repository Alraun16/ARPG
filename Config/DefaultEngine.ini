[/Script/Engine.RendererSettings]

; === Static / baked lighting ===
r.AllowStaticLighting=True
r.NormalMapsForStaticLighting=True

; === Disable Lumen / UE5 dynamic GI path ===
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=2
r.Lumen.HardwareRayTracing=False
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=False

; === Disable distance fields if not using DFAO / distance field shadows ===
r.GenerateMeshDistanceFields=False

; === Disable ray tracing / path tracing ===
r.RayTracing=False
r.RayTracing.Shadows=False
r.RayTracing.RayTracingProxies.ProjectEnabled=False
r.PathTracing=False

; === Disable Virtual Shadow Maps ===
r.Shadow.Virtual.Enable=0

; === Keep Skin Cache as-is for now ===
r.SkinCache.CompileShaders=True

; === Keep Substrate exactly as it currently is ===
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0

; === Anti-aliasing: keep decent default, not FXAA potato mode ===
r.AntiAliasingMethod=2
r.TemporalAA.Upsampling=True
r.MSAACount=1

; === Sensible post-process defaults ===
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AutoExposure=False

; These become mostly irrelevant if default Auto Exposure is off,
; but keeping them does not hurt if some camera/post-process re-enables exposure.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; === Texture streaming ===
r.TextureStreaming=True
r.Mobile.AmbientOcclusion=True

